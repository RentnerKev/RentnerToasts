[install]
minimumReleaseAge = 86400
linker = "isolated"
globalStore = false
[test]
root = "src/tests"
pathIgnorePatterns = ["**/*.db.test.ts"]

# The empty .oxfmtrc.json preserves Bun's Oxfmt output mode.
[fmt]
semi = false
singleQuote = true
trailingComma = "all"
tabWidth = 4
useTabs = false
printWidth = 80
sortPackageJson = false
ignorePatterns = [
    "**/dist/**",
    "**/build/**",
    "**/node_modules/**",
    "**/drizzle/**",
    "**/.env",
    "**/.env.*",
    "**/routeTree.gen.*",
    "**/*.generated.*",
    "**/target/**",
    "test-results/**",
    "playwright-report/**",
    "coverage/**",
    "bun.lock",
    "playground/bun.lock",
]
