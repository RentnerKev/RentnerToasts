name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.0

            - name: Install library dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Lint
              run: bun run lint

            - name: Check formatting
              run: bun run format:check

            - name: Run tests
              run: bun run test

            - name: Build library
              run: bun run build

            - name: Install playground dependencies
              working-directory: playground
              run: bun install --frozen-lockfile

            - name: Typecheck playground
              working-directory: playground
              run: bunx --bun tsc --noEmit -p tsconfig.json

            - name: Build playground
              working-directory: playground
              run: bun run build

    react-compatibility:
        name: React ${{ matrix.react-version }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                react-version:
                    - 19.0.0
                    - 19.3.0

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.0

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Select React version
              run: bun add --no-save react@${{ matrix.react-version }} react-dom@${{ matrix.react-version }} @types/react@${{ matrix.react-version }} @types/react-dom@${{ matrix.react-version }}

            - name: Verify React compatibility
              run: bun run typecheck && bun run test && bun run build
