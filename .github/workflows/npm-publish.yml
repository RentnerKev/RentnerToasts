name: Publish npm package

on:
    release:
        types:
            - published
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag to publish
                required: true
                default: v3.0.0
                type: string

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Validate release tag
              id: release
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
              shell: bash
              run: |
                  set -euo pipefail

                  if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                    echo "::error title=Invalid release tag::Expected vMAJOR.MINOR.PATCH, received '$RELEASE_TAG'"
                    exit 1
                  fi

                  echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

            - name: Checkout release tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ steps.release.outputs.tag }}
                  fetch-depth: 1
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.2

            - name: Set up Node and npm registry
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install Playwright browser
              run: bunx playwright install --with-deps chromium

            - name: Derive package version
              id: release-version
              env:
                  RELEASE_TAG: ${{ steps.release.outputs.tag }}
              run: echo "package_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

            - name: Verify package name
              run: |
                  node -e "const packageJson = require('./package.json'); if (packageJson.name !== '@rentnerkev/toasts') { throw new Error('Unexpected package name: ' + packageJson.name) }"

            - name: Set release version for this CI run
              env:
                  PACKAGE_VERSION: ${{ steps.release-version.outputs.package_version }}
              run: npm version "$PACKAGE_VERSION" --allow-same-version --no-git-tag-version --ignore-scripts

            - name: Verify package version
              env:
                  PACKAGE_VERSION: ${{ steps.release-version.outputs.package_version }}
              run: |
                  node -e "const packageJson = require('./package.json'); if (packageJson.version !== process.env.PACKAGE_VERSION) { throw new Error('Unexpected package version: ' + packageJson.version) }"

            - name: Run production checks
              run: bun run verify

            - name: Inspect npm package
              run: npm pack --dry-run

            - name: Verify npm package contents
              run: |
                  npm pack --dry-run --json --ignore-scripts > npm-pack.json

                  node <<'NODE'
                  const { readFileSync } = require('node:fs')

                  const packageFiles = JSON.parse(
                    readFileSync('npm-pack.json', 'utf8'),
                  )[0].files.map(({ path }) => path)

                  const forbiddenPrefixes = [
                    'playground/',
                    'src/',
                    'test/',
                    'tests/',
                    '.github/',
                  ]

                  const forbiddenFiles = packageFiles.filter((file) =>
                    forbiddenPrefixes.some((prefix) => file.startsWith(prefix)),
                  )

                  if (forbiddenFiles.length > 0) {
                    throw new Error(
                      `Forbidden package files: ${forbiddenFiles.join(', ')}`,
                    )
                  }
                  NODE

            - name: Publish package with trusted publishing
              run: npm publish --access public
