name: Publish npm package

on:
    release:
        types:
            - published

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Validate release tag
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              shell: bash
              run: |
                  set -euo pipefail

                  if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                    echo "::error title=Invalid release tag::Expected vMAJOR.MINOR.PATCH, received '$RELEASE_TAG'"
                    exit 1
                  fi

            - name: Checkout release tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.release.tag_name }}
                  fetch-depth: 1
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0

            - name: Set up Node and npm registry
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Derive package version
              id: release-version
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: echo "package_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

            - name: Verify package name
              run: |
                  node -e "const packageJson = require('./package.json'); if (packageJson.name !== '@rentnerkev/toasts') { throw new Error('Unexpected package name: ' + packageJson.name) }"

            - name: Set release version for this CI run
              env:
                  PACKAGE_VERSION: ${{ steps.release-version.outputs.package_version }}
              run: npm version "$PACKAGE_VERSION" --no-git-tag-version --ignore-scripts

            - name: Verify package version
              env:
                  PACKAGE_VERSION: ${{ steps.release-version.outputs.package_version }}
              run: |
                  node -e "const packageJson = require('./package.json'); if (packageJson.version !== process.env.PACKAGE_VERSION) { throw new Error('Unexpected package version: ' + packageJson.version) }"

            - name: Run production checks
              run: bun run check

            - name: Inspect npm package
              run: npm pack --dry-run

            - name: Verify npm package contents
              run: |
                  npm pack --dry-run --json --ignore-scripts > npm-pack.json

                  node <<'NODE'
                  const { readFileSync } = require('node:fs')

                  const packageFiles = JSON.parse(
                    readFileSync('npm-pack.json', 'utf8'),
                  )[0].files.map(({ path }) => path)

                  const forbiddenPrefixes = [
                    'playground/',
                    'src/',
                    'test/',
                    'tests/',
                    '.github/',
                  ]

                  const forbiddenFiles = packageFiles.filter((file) =>
                    forbiddenPrefixes.some((prefix) => file.startsWith(prefix)),
                  )

                  if (forbiddenFiles.length > 0) {
                    throw new Error(
                      `Forbidden package files: ${forbiddenFiles.join(', ')}`,
                    )
                  }
                  NODE

            - name: Verify npm authentication
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npm whoami --registry=https://registry.npmjs.org

            - name: Publish package
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npm publish --access public
