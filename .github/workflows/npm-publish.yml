name: Publish package
on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: Existing stable release tag to publish
                required: true
                type: string
permissions:
    contents: read
concurrency:
    group: npm-publish-${{ github.repository }}-latest
    cancel-in-progress: false
jobs:
    publish:
        name: Publish npm package
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout trusted main automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  path: automation
                  persist-credentials: false
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.2
            - name: Validate stable release identity
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bun automation/.github/scripts/release/identity.ts
            - name: Checkout exact release tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ steps.release.outputs.tag }}
                  path: source
                  fetch-depth: 0
                  persist-credentials: false
            - name: Verify committed version and main ancestry
              working-directory: source
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bun "$GITHUB_WORKSPACE/automation/.github/scripts/release/identity.ts" --checkout
            - name: Set up Node and npm trusted publishing
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false
            - name: Install exact-source dependencies
              working-directory: source
              run: bun install --frozen-lockfile
            - name: Install Playwright browsers
              working-directory: source
              run: bunx playwright install --with-deps chromium firefox webkit
            - name: Verify exact-source package
              working-directory: source
              run: bun run verify
            - name: Inspect package
              working-directory: source
              run: npm pack --dry-run --ignore-scripts
            - name: Publish immutable verified artifact
              working-directory: source
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bun "$GITHUB_WORKSPACE/automation/.github/scripts/release/publish.ts"
